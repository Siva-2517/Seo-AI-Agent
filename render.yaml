# Render Blueprint for SEO Agent Backend
# Deploy: Connect this repo to Render and it will auto-detect this file

services:
  # Backend Web Service
  - type: web
    name: seo-agent-api
    env: python
    region: oregon
    plan: free  # or starter, standard for production
    buildCommand: |
      cd backend
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      cd backend
      gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "${ALLOWED_ORIGINS}"
      - key: REFERENCE_WEBSITE
        value: "https://appincoimbatore.com"
      - key: BUSINESS_CATEGORY
        value: "Digital Marketing Course in Coimbatore"
      - key: BUSINESS_NAME
        value: "Appin Technology"
      - key: BUSINESS_LOCATION
        value: "Coimbatore"
      - key: MAX_RETRY_ATTEMPTS
        value: "2"
      - key: MIN_VALIDATION_SCORE
        value: "70"
      - key: LOG_LEVEL
        value: "INFO"

  # PostgreSQL Database (Render-managed PostgreSQL)
  # For Neon PostgreSQL, see instructions in DEPLOYMENT_LINKING.md
databases:
  - name: seo-agent-db
    databaseName: seo_agent
    user: seo_agent
    plan: free  # or starter for production
