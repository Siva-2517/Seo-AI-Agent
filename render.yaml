# Render Blueprint for SEO Agent Backend
# Deploy: Connect this repo to Render and it will auto-detect this file

services:
  # Backend Web Service
  - type: web
    name: seo-agent-api
    env: python
    region: oregon  # or singapore, frankfurt, etc.
    plan: free  # or starter, standard for production
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false  # Set in Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: seo-agent-db
          property: connectionString
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "${ALLOWED_ORIGINS}"  # Set in Render Dashboard or use environment variable
      - key: REFERENCE_WEBSITE
        value: "https://appincoimbatore.com"
      - key: BUSINESS_CATEGORY
        value: "Digital Marketing Course in Coimbatore"
      - key: BUSINESS_NAME
        value: "Appin Technology"
      - key: BUSINESS_LOCATION
        value: "Coimbatore"
      - key: MAX_RETRY_ATTEMPTS
        value: "2"
      - key: MIN_VALIDATION_SCORE
        value: "70"
      - key: LOG_LEVEL
        value: "INFO"

  # PostgreSQL Database (Neon-compatible on Render)
  # Note: For actual Neon, use externalDatabase instead
  # This creates a managed PostgreSQL on Render
databases:
  - name: seo-agent-db
    databaseName: seo_agent
    user: seo_agent
    plan: free  # or starter for production

# ===========================================
# FOR NEON POSTGRESQL (External Database):
# ===========================================
# Remove the databases section above and use this instead:
#
# envVars:
#   - key: DATABASE_URL
#     sync: false  # Set in Render dashboard with your Neon connection string
#
# Then in Render Dashboard > Environment > Add:
# DATABASE_URL = postgresql://user:pass@ep-xxx.region.aws.neon.tech/dbname?sslmode=require
# ===========================================